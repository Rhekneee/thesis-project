<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Add side_top.css -->
    <link rel="stylesheet" href="/public/css/side_top.css">
    <style>
        /* Copy all styles from views/developer/profile.html */
        /* ... existing styles ... */
    </style>
</head>
<body>
    <div id="customAlert" class="custom-alert">
        <i class="fas fa-check-circle"></i>
        <span id="alertMessage"></span>
    </div>
    <div id="wrapper">
        <!-- Topbar -->
        <div class="topbar">
            <div class="topbar-left">
                <div class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
            <div class="topbar-right">
                <div class="notification-icon" onclick="toggleNotifications()">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge"></span>
                </div>
                <div class="profile-section" onclick="window.location.href='/profiles/developer'">
                    <div class="profile-info">
                        <div class="profile-name"></div>
                        <div class="profile-position"></div>
                    </div>
                    <div class="profile-picture-container" style="width: 40px; height: 40px; margin: 0;">
                        <img src="/crm/default-profile-picture" alt="Profile" class="profile-picture" id="topbarProfilePicture">
                    </div>
                </div>
            </div>
            
            <!-- Notification Dropdown -->
            <div class="notification-dropdown" id="notificationDropdown">
                <div class="notification-header">
                    <span>Notifications</span>
                    <button class="mark-all-read" onclick="markAllAsRead()">Mark all as read</button>
                </div>
                <div class="notification-item">
                    <div class="notification-title">New Leave Request</div>
                    <div class="notification-time">5 minutes ago</div>
                </div>
                <div class="notification-item">
                    <div class="notification-title">Payroll Processed</div>
                    <div class="notification-time">1 hour ago</div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">
                <img src="/image/mdb-removebg-preview.png" alt="MDB Logo">
                <span class="company-title">MDB Construction</span>
            </div>
            <ul class="list-unstyled">
                <li class="nav-item">
                    <a href="/profiles/developer" class="nav-link active">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/profiles/developer/security_questions" class="nav-link">
                        <i class="fas fa-question-circle"></i>
                        <span>Security Questions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/profiles/developer/change-password" class="nav-link">
                        <i class="fas fa-key"></i>
                        <span>Change Password</span>
                    </a>
                </li>
            </ul>
            <!-- Move Logout outside the main ul -->
            <div class="logout-container">
                <a href="/logout" class="logout-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="logout-text">Logout</span>
                </a>
            </div>
        </div>

        <!-- Main content area -->
        <div id="content">
            <div class="container-fluid">
                <div class="profile-container">
                    <!-- Back Button -->
                    <div class="back-button">
                        <a href="/dashboard" class="btn btn-outline-primary">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>

                    <!-- Loading State -->
                    <div id="loadingState" class="text-center">
                        <div class="loading-spinner"></div>
                        <p>Loading profile data...</p>
                    </div>

                    <!-- Error State -->
                    <div id="errorState" class="error-message" style="display: none;">
                        <i class="fas fa-exclamation-circle"></i>
                        Failed to load profile data. Please try again later.
                    </div>

                    <!-- Profile Content -->
                    <div id="profileContent" style="display: none;">
                        <!-- Copy the rest of the profile content from views/developer/profile.html -->
                        <!-- ... existing content ... -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Add sidebar toggle scripts -->
    <script>
        // Copy all JavaScript from views/developer/profile.html
        // ... existing scripts ...
    </script>
    <!-- Add side_top.js -->
    <script src="/public/js/side_top.js"></script>
</body>
</html>
