<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Virtual Tour</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
  
    /* Container for the panorama viewer */
    .panorama-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* Full viewport height */
      padding: 10px;
    }
  
    /* Styling the panorama viewer */
    #panorama {
      width: 100%;
      max-width: 1000px; /* Max width for large screens */
      height: 500px; /* Set height for the viewer */
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      background-color: #000; /* Black background for the panorama */
      background-image: url('/image/mdb.jpg'); /* Loading image */
      background-position: center; /* Center the image */
      background-repeat: no-repeat; /* No repeat */
    }
  
    /* Styling for the header */
    h1 {
      position: absolute;
      top: 50px; /* 50px down from the top of the page */
      left: 50%;  /* 50% from the left edge of the page */
      transform: translateX(-50%); /* Center it horizontally */
      font-size: 32px;
      color: #333;
    }
  
    /* For smaller screens, reduce the panorama size */
    @media screen and (max-width: 768px) {
      #panorama {
        height: 300px; /* Adjust height on small screens */
      }
    }
  
  </style>
  
</head>
<body>
    <h1>Virtual Tour</h1>
  
    <div class="panorama-container">
      <div id="panorama"></div>
    </div>
    
    <!-- Hotspot Controls -->
    <div style="position: fixed; top: 100px; right: 20px; z-index: 1000;">
      <button id="editHotspots" class="btn btn-primary" onclick="toggleHotspotEdit()">
        <i class="bi bi-plus-circle"></i> Edit Hotspots
      </button>
    </div>
  
    <script>
      let viewer;
      let isEditMode = false;
      let currentScene = 'room1';

      // Initialize the viewer
      viewer = pannellum.viewer('panorama', {
        "default": {
          "firstScene": "room1",
          "sceneFadeDuration": 1000,
        },

        "scenes": {
          "room1": {
            "title": "Room 1",
            "type": "equirectangular",
            "panorama": "/image/20251003_131026_592.jpg",
            "hotSpots": [
              {
                "pitch": 0,
                "yaw": 5000,
                "type": "scene",
                "text": "Go to Room 2",
                "sceneId": "room2"
              }
            ]
          },
          "room2": {
            "title": "Room 2",
            "type": "equirectangular",
            "panorama": "/image/20251003_131037_674.jpg",
            "hotSpots": [
              {
                "pitch": 0,
                "yaw": -100,
                "type": "scene",
                "text": "Back to Room 1",
                "sceneId": "room1"
              }
            ]
          }
        }
      });

      // Track current scene
      viewer.on('scenechange', function() {
        currentScene = viewer.getScene();
      });

      // Toggle hotspot editing mode
      function toggleHotspotEdit() {
        isEditMode = !isEditMode;
        const button = document.getElementById('editHotspots');
        
        if (isEditMode) {
          button.innerHTML = '<i class="bi bi-check-circle"></i> Save Hotspots';
          button.classList.remove('btn-primary');
          button.classList.add('btn-success');
          enableHotspotEditing();
        } else {
          button.innerHTML = '<i class="bi bi-plus-circle"></i> Edit Hotspots';
          button.classList.remove('btn-success');
          button.classList.add('btn-primary');
          disableHotspotEditing();
        }
      }

      // Enable hotspot editing
      function enableHotspotEditing() {
        const container = document.getElementById('panorama');
        
        // Add click listener to the panorama container
        container.addEventListener('click', addHotspotOnClick);
        
        // Show instructions
        showInstructions();
      }

      // Disable hotspot editing
      function disableHotspotEditing() {
        const container = document.getElementById('panorama');
        container.removeEventListener('click', addHotspotOnClick);
        hideInstructions();
      }

      // Add hotspot when clicking on the panorama
      function addHotspotOnClick(event) {
        if (!isEditMode) return;
        
        // Get the click position relative to the panorama
        const rect = event.target.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        
        // Convert screen coordinates to panorama coordinates
        const coords = viewer.mouseEventToCoords(event);
        
        // Prompt for hotspot details
        const hotspotText = prompt('Enter hotspot text:');
        if (!hotspotText) return;
        
        const targetScene = prompt('Enter target scene ID (room1, room2, etc.):');
        if (!targetScene) return;
        
        // Add the hotspot
        viewer.addHotSpot({
          pitch: coords.pitch,
          yaw: coords.yaw,
          type: 'scene',
          text: hotspotText,
          sceneId: targetScene
        }, currentScene);
        
        console.log('Added hotspot at:', coords);
      }

      // Show editing instructions
      function showInstructions() {
        const instructions = document.createElement('div');
        instructions.id = 'editingInstructions';
        instructions.style.cssText = `
          position: fixed;
          top: 150px;
          right: 20px;
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 15px;
          border-radius: 5px;
          z-index: 1001;
          max-width: 200px;
        `;
        instructions.innerHTML = `
          <h6>Editing Mode</h6>
          <p>Click anywhere on the panorama to add a hotspot.</p>
          <small>You'll be prompted for text and target scene.</small>
        `;
        document.body.appendChild(instructions);
      }

      // Hide editing instructions
      function hideInstructions() {
        const instructions = document.getElementById('editingInstructions');
        if (instructions) {
          instructions.remove();
        }
      }

      // Add Bootstrap CSS for the button
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css';
      document.head.appendChild(link);
    </script>
</body>
</html>
